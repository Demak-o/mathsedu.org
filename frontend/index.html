<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mathsedu.org</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="home" id="home-panel">
        <p class="eyebrow">Private Friends Network</p>
        <h1>mathsedu.org</h1>
        <p class="subtitle">A secure home base for your friend group.</p>
        <div class="actions">
          <button id="show-signup" class="btn primary" type="button">Sign up</button>
          <button id="show-signin" class="btn ghost" type="button">Sign in</button>
        </div>
      </section>

      <section class="panel hidden" id="signup-panel">
        <h2>Create account</h2>
        <form id="signup-form">
          <input name="displayName" placeholder="Display name" required />
          <input name="realName" placeholder="Real name" required />
          <input name="email" type="email" placeholder="Email" required />
          <input name="phone" type="tel" placeholder="Phone (+1...)" required />
          <input name="password" type="password" placeholder="Create password" required minlength="8" />
          <input name="confirmPassword" type="password" placeholder="Retype password" required minlength="8" />
          <button class="btn primary" type="submit">Create account</button>
        </form>
        <p id="signup-result" class="result"></p>
        <button id="back-from-signup" class="link-btn" type="button">Back</button>
      </section>

      <section class="panel hidden" id="signin-panel">
        <h2>Sign in</h2>
        <form id="login-form">
          <input name="email" type="email" placeholder="Email" required />
          <input name="password" type="password" placeholder="Password" required />
          <button class="btn primary" type="submit">Sign in</button>
        </form>
        <p id="login-result" class="result"></p>
        <button id="back-from-signin" class="link-btn" type="button">Back</button>
      </section>
    </main>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
